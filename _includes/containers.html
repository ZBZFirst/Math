<div class="page-content">
    <!-- Title Container -->
    <div class="container title-container">
        <h1 class="page-title">{{ page.title }}</h1>
        <p class="page-description">{{ page.description }}</p>
    </div>

    <!-- Workspace Container -->
    <div class="container workspace-container">
        <div class="problem-display">
            <div class="problem-statement" id="problemStatement">
                <!-- JS will fill this -->
                <p>Loading problem...</p>
            </div>
            <div class="user-input">
                <input type="number" id="userAnswer" placeholder="Enter your answer">
                <button id="submitAnswer">Submit</button>
                <button id="newProblem">New Problem</button>
            </div>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>

    <!-- Ratio Container -->
    <div class="container ratio-container">
        <div class="score-display">
            <h3>Your Progress</h3>
            <div class="score-stats">
                <div class="stat correct">
                    <span class="stat-label">Correct:</span>
                    <span class="stat-value" id="correctCount">0</span>
                </div>
                <div class="stat incorrect">
                    <span class="stat-label">Incorrect:</span>
                    <span class="stat-value" id="incorrectCount">0</span>
                </div>
                <div class="stat total">
                    <span class="stat-label">Total:</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
                <div class="stat accuracy">
                    <span class="stat-label">Accuracy:</span>
                    <span class="stat-value" id="accuracyRate">0%</span>
                </div>
            </div>
            <button id="resetScores">Reset Scores</button>
        </div>
    </div>
</div>
