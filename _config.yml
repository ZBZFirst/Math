title: Math Practice
description: Practice addition, subtraction, multiplication, and division
baseurl: "" # leave empty if not using GitHub Pages subdirectory
url: "" # leave empty or set to your domain

# REMOVE the theme line or set it to null
theme: null

# Build settings
markdown: kramdown

# Custom variables for navigation
math_operations:
  - name: Addition
    path: Math/addition.html
  - name: Subtraction
    path: Math/subtraction.html
  - name: Multiplication
    path: Math/multiplication.html
  - name: Division
    path: Math/division.html

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
