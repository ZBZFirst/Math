title: Math Practice
description: Practice addition, subtraction, multiplication, and division
baseurl: "" # leave empty if not using GitHub Pages subdirectory
url: "" # leave empty or set to your domain

# Build settings
markdown: kramdown
theme: minima
plugins:
  - jekyll-feed

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Custom variables
math_operations:
  - name: Addition
    path: /addition.html
  - name: Subtraction
    path: /subtraction.html
  - name: Multiplication
    path: /multiplication.html
  - name: Division
    path: /division.html
