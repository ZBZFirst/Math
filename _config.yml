title: Math Practice
description: Practice addition, subtraction, multiplication, and division
baseurl: "/Math"  # Add this since your repo is named "Math"
url: "https://zbzfirst.github.io"

# Build settings
markdown: kramdown
theme: null

# Custom variables for navigation
math_operations:
  - name: Addition
    path: /addition/  # Remove "Math/" prefix, baseurl handles it
  - name: Subtraction
    path: /subtraction/
  - name: Multiplication
    path: /multiplication/
  - name: Division
    path: /division/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
