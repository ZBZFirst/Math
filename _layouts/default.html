<!-- Math/_layouts/defaults.html -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}
    </title>
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
    {% if page.operation %}
    <meta name="operation" content="{{ page.operation }}">
    {% endif %}
</head>
<body>
    {% include header.html %}
    
    <main class="page-content">
        {{ content }}
    </main>
    
    {% include footer.html %}
    
    {% if page.operation %}
    <script src="{{ site.baseurl }}/assets/js/math-practice.js"></script>
    {% endif %}
</body>
</html>
