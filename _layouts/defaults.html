<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% if page.title %}{{ page.title }} - {{ site.title }}{% else %}{{ site.title }}{% endif %}
    </title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% if page.operation %}
    <meta name="operation" content="{{ page.operation }}">
    {% else %}
    <meta name="operation" content="addition">
    {% endif %}
</head>
<body>
    {% include header.html %}
    
    <main class="page-content" aria-label="Content">
        {% if page.show_containers %}
            {% include containers.html %}
        {% else %}
            {{ content }}
        {% endif %}
    </main>
    
    {% include footer.html %}
    
    {% if page.show_containers %}
    <script src="{{ '/assets/js/math-practice.js' | relative_url }}"></script>
    {% endif %}
</body>
</html>
